# Nginx configuration for load balancing ASP.NET Core application
# This file should be placed in /usr/local/etc/nginx/nginx.conf (macOS Homebrew)
# or /etc/nginx/nginx.conf (Linux)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Logging
    error_log /opt/homebrew/var/log/nginx/error.log warn;
    access_log /opt/homebrew/var/log/nginx/access.log;
    
    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Increase limits for large matrix data
    client_max_body_size 2048M;
    client_body_buffer_size 2048M;
    
    # Timeouts for long-running calculations
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # Define upstream for SignalR - use only ONE server
    # ip_hash doesn't work for localhost (all requests from 127.0.0.1)
    # Redis Backplane will propagate messages to all servers
    upstream signalr_backend {
        server localhost:5001;
    }
    
    # Define upstream servers for general requests
    upstream aspnet_backend {
        # Use least_conn for intelligent load balancing
        # Distributes requests to server with least active connections
        least_conn;
        
        server localhost:5001;
        server localhost:5002;
        
        # Keep-alive connections to backend
        keepalive 32;
    }

    # Custom log format to show which upstream server handled the request
    log_format upstreamlog '[$time_local] $remote_addr - $request -> Upstream: $upstream_addr - Status: $status - Time: ${upstream_response_time}s';

    server {
        listen 80;
        server_name localhost;

        # Access log with upstream information
        access_log /opt/homebrew/var/log/nginx/access.log upstreamlog;
        error_log /opt/homebrew/var/log/nginx/error.log;

        # API endpoints - critical for matrix operations
        location /api/ {
            proxy_pass http://aspnet_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Cookie support for authentication
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            
            # Large timeouts for matrix calculations
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            
            # Buffering settings
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 8 128k;
        }

        # SignalR WebSocket support (uses sticky sessions via ip_hash)
        location /progressHub {
            proxy_pass http://signalr_backend;
            
            # WebSocket headers - critical for SignalR
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Cookie support for authentication
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            
            # Disable buffering for WebSocket
            proxy_buffering off;
            
            # Disable cache for WebSocket
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts for long-lived WebSocket connections
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # All other requests (HTML pages, static files, etc)
        location / {
            proxy_pass http://aspnet_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Cookie support for authentication
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            
            # Connection settings
            proxy_set_header Connection "";
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }
    }
}

