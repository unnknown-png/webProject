worker_processes auto;

events {
    worker_connections 1024;
}

http {
    error_log /opt/homebrew/var/log/nginx/error.log warn;
    access_log /opt/homebrew/var/log/nginx/access.log;
    
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    client_max_body_size 2048M;
    client_body_buffer_size 2048M;
    
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    upstream signalr_backend {
        server localhost:5001;
    }
    
    upstream aspnet_backend {
        least_conn;
        
        server localhost:5001;
        server localhost:5002;
        
        keepalive 32;
    }

    log_format upstreamlog '[$time_local] $remote_addr - $request -> Upstream: $upstream_addr - Status: $status - Time: ${upstream_response_time}s';

    server {
        listen 80;
        server_name localhost;

        access_log /opt/homebrew/var/log/nginx/access.log upstreamlog;
        error_log /opt/homebrew/var/log/nginx/error.log;

        location /api/ {
            proxy_pass http://aspnet_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 8 128k;
        }

        location /progressHub {
            proxy_pass http://signalr_backend;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            
            proxy_buffering off;
            
            proxy_cache_bypass $http_upgrade;
            
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        location / {
            proxy_pass http://aspnet_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            
            proxy_set_header Connection "";
            
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }
    }
}

